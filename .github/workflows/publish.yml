name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      # Identical correctness gate to ci.yml — a release must not pass on a
      # weaker set of checks than a PR. `ci:verify` is the shared composite; the
      # docs-live determinism diff and perf baseline mirror ci.yml exactly.
      - run: pnpm ci:verify
      - run: pnpm docs:all
      - run: git diff --exit-code docs-live
      - run: pnpm --filter @libar-dev/architect-projection test:perf:baseline
      # changeset:publish passes `--tag pre` so the current 2.0.0-pre.* versions
      # land on the `pre` dist-tag, not `latest` (matches the registry: latest is
      # the last stable line, `pre` is the prerelease channel). REVISIT before the
      # first stable 2.0.0 release — a hardcoded `--tag pre` would mis-route a
      # stable publish onto the prerelease channel.
      - run: pnpm changeset:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
